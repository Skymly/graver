[lib]
name = "graver_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_TextServices",
] }

[lints]
workspace = true
