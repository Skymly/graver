[workspace]
resolver = "3"
members = [
    "crates/graver-engine",
    "crates/graver-ipc",
    "crates/graver-service",
    "crates/graver-tsf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
